name: CI

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened, edited]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  OPENSPEC_VERSION: 1.16.0

jobs:
  check:
    name: Format, lint and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --check
      - run: cargo clippy --all-targets --locked -- -D warnings
      - run: cargo test --locked

  build:
    name: Build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --locked

  openspec:
    name: OpenSpec validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Fetch current main for PR validation
        if: github.event_name == 'pull_request'
        run: git fetch origin +refs/heads/main:refs/remotes/origin/main
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm install -g "@fission-ai/openspec@$OPENSPEC_VERSION"
      - run: python3 -m unittest discover -s scripts/tests
      - run: openspec validate --all --strict --no-interactive
      - run: openspec validate --archived --strict --no-interactive
      - name: Validate proposed squash message
        if: github.event_name == 'pull_request'
        run: python3 scripts/openspec_ci.py check-pr "$GITHUB_EVENT_PATH"

  archive:
    name: Propose completed OpenSpec archives
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [check, build, openspec]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    concurrency:
      group: openspec-archive-main
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - name: Skip stale pushes
        id: current
        run: |
          git fetch origin main
          if [ "$(git rev-parse FETCH_HEAD)" = "$GITHUB_SHA" ]; then
            echo 'current=true' >> "$GITHUB_OUTPUT"
          else
            echo 'A newer main push will process all referenced changes.'
          fi
      - uses: actions/setup-node@v4
        if: steps.current.outputs.current == 'true'
        with:
          node-version: 24
      - run: npm install -g "@fission-ai/openspec@$OPENSPEC_VERSION"
        if: steps.current.outputs.current == 'true'
      - name: Archive complete referenced changes
        if: steps.current.outputs.current == 'true'
        env:
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.sha }}
        run: python3 scripts/openspec_ci.py archive-push "$BEFORE" "$AFTER"
      - name: Recheck main before publishing
        id: publish-base
        if: steps.current.outputs.current == 'true'
        run: |
          git fetch origin main
          if [ "$(git rev-parse FETCH_HEAD)" = "$GITHUB_SHA" ]; then
            echo 'current=true' >> "$GITHUB_OUTPUT"
          else
            echo 'Main advanced during archive generation; a later successful run will recover.'
          fi
      - uses: peter-evans/create-pull-request@v7
        if: steps.publish-base.outputs.current == 'true'
        with:
          token: ${{ secrets.OPENSPEC_ARCHIVE_TOKEN || github.token }}
          branch: automation/openspec-archive
          base: main
          add-paths: openspec/**
          commit-message: |-
            chore: archive completed OpenSpec changes

            OpenSpec-Change: none
            OpenSpec-Archive-Base: ${{ github.sha }}
          title: 'chore: archive completed OpenSpec changes'
          body: |-
            Automated archive of completed, validated changes. Review the spec updates before merging.

            Generated from main revision `${{ github.sha }}`. If stale, regenerate rather than rebase.

            OpenSpec-Change: none

  commits:
    name: Conventional commits
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: wagoid/commitlint-github-action@v6
